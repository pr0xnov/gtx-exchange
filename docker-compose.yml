services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # No hardcoded fallback on purpose — the official postgres image
      # itself refuses to start with an unset/empty POSTGRES_PASSWORD,
      # which is the fail-fast behavior we want here (see .env.example).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gtx_postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback only, not 0.0.0.0 — every service that needs
      # Postgres (migrator, web, ws) already reaches it over the internal
      # Docker network via the "postgres" hostname; this mapping exists
      # solely so a host-side tool (psql, Prisma Studio, a DB GUI) can
      # still connect to localhost:5432 for admin/debugging. On a VPS this
      # means the DB is reachable from that machine only, never the public
      # internet — remove this mapping entirely if even that isn't needed.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Was missing entirely — prisma/seed.ts now gates its demo-user seed
      # (demo@gtx.com / a well-known password) on this being exactly
      # "production", so it must actually reach the container. Without it,
      # that check would silently never see "production" and the demo
      # account would keep seeding on every real deploy.
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # NEXT_PUBLIC_* values are inlined at build time (see Dockerfile's
        # builder stage) — this is what actually gets the real production
        # WS URL into the browser bundle, instead of the previous silent
        # "ws://localhost:8080" fallback baked into every build.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # No hardcoded fallback — lib/env.ts fails fast (refuses to start)
      # if these are missing outside of the build phase itself. Generate
      # real values with: openssl rand -base64 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # No insecure fallback here on purpose (unlike the two JWT secrets
      # above) — see .env.example. If unset, only the SUPER_ADMIN "Show
      # password" feature reports a config error; nothing else breaks.
      PASSWORD_ENCRYPTION_KEY: ${PASSWORD_ENCRYPTION_KEY}
      NODE_ENV: production
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      # Gates trusting proxy-supplied IP/country headers (see
      # .env.example) — was missing from this list entirely, so setting
      # it in .env alone could never actually reach the container (same
      # "must be explicitly listed" gotcha the SMTP vars below already
      # document). Defaults to untrusted/off either way.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # /contacts's Telegram support card — see .env.example. Left unset by
      # default; the button disables itself rather than link to an
      # invented username.
      NEXT_PUBLIC_SUPPORT_TELEGRAM_URL: ${NEXT_PUBLIC_SUPPORT_TELEGRAM_URL:-}
      # Outbound email (password reset / password-changed / email-change
      # notices — see lib/email/mailer.ts). All optional and deliberately
      # WITHOUT a fallback: previously these weren't listed here at all, so
      # even a fully-configured .env could never actually reach the app —
      # docker-compose only forwards variables that are explicitly named
      # under a service's `environment:`, .env alone isn't enough. Leaving
      # any of these unset is fine (mailer.ts falls back to logging the
      # message instead of sending), but they must be listed to have any
      # chance of being forwarded at all.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # The domain used to build links inside outgoing emails (password
      # reset, email-change confirmation) — must be the real public
      # domain in production, never left as the localhost default.
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      # Persists Next's own fetch-response cache across container
      # recreates — without this, a rebuild/recreate wipes the container's
      # writable layer and every cached external fetch (Binance market
      # data, RSS feeds, etc) would start cold again on the next request.
      - gtx_next_cache:/app/.next/cache
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WS_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  gtx_postgres_data:
  gtx_next_cache:
