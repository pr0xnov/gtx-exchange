services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtx
      POSTGRES_PASSWORD: gtx_password
      POSTGRES_DB: gtx_exchange
    volumes:
      - gtx_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtx -d gtx_exchange"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://gtx:gtx_password@postgres:5432/gtx_exchange
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gtx:gtx_password@postgres:5432/gtx_exchange
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_access_secret_to_something_random_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_to_something_random_32}
      # No insecure fallback here on purpose (unlike the two JWT secrets
      # above) — see .env.example. If unset, only the SUPER_ADMIN "Show
      # password" feature reports a config error; nothing else breaks.
      PASSWORD_ENCRYPTION_KEY: ${PASSWORD_ENCRYPTION_KEY}
      NODE_ENV: production
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      # Gates trusting proxy-supplied IP/country headers (see
      # .env.example) — was missing from this list entirely, so setting
      # it in .env alone could never actually reach the container (same
      # "must be explicitly listed" gotcha the SMTP vars below already
      # document). Defaults to untrusted/off either way.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # /contacts's Telegram support card — see .env.example. Left unset by
      # default; the button disables itself rather than link to an
      # invented username.
      NEXT_PUBLIC_SUPPORT_TELEGRAM_URL: ${NEXT_PUBLIC_SUPPORT_TELEGRAM_URL:-}
      # Outbound email (password reset / password-changed / email-change
      # notices — see lib/email/mailer.ts). All optional and deliberately
      # WITHOUT a fallback: previously these weren't listed here at all, so
      # even a fully-configured .env could never actually reach the app —
      # docker-compose only forwards variables that are explicitly named
      # under a service's `environment:`, .env alone isn't enough. Leaving
      # any of these unset is fine (mailer.ts falls back to logging the
      # message instead of sending), but they must be listed to have any
      # chance of being forwarded at all.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # The domain used to build links inside outgoing emails (password
      # reset, email-change confirmation) — must be the real public
      # domain in production, never left as the localhost default.
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      # Persists Next's own fetch-response cache across container
      # recreates — without this, a rebuild/recreate wipes the container's
      # writable layer and every cached external fetch (Binance market
      # data, RSS feeds, etc) would start cold again on the next request.
      - gtx_next_cache:/app/.next/cache
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gtx:gtx_password@postgres:5432/gtx_exchange
      WS_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  gtx_postgres_data:
  gtx_next_cache:
